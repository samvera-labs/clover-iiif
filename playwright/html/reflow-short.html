<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clover Short Canvas Fixture</title>
    <script src="./wc.js"></script>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; }
      /* Narrow enough that the row of controls has to wrap. */
      clover-viewer { display: block; max-width: 340px; }
    </style>
  </head>
  <body>
    <!--
      The companion to reflow.html, for the two ways a bounded cluster goes wrong rather
      than the overflow itself: a wrapped line stranded mid-canvas, and controls shrunk
      below a usable size. Both need a canvas short enough to squeeze the cluster, which
      the 260px fixture is not.
    -->
    <clover-viewer options='{"canvasHeight":"150px"}'></clover-viewer>
    <script>
      document
        .querySelector("clover-viewer")
        .setAttribute(
          "iiif-content",
          new URL("./reflow-manifest.json", location.href).href,
        );
    </script>
  </body>
</html>
