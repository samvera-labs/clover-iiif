<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clover Reflow Fixture</title>
    <script src="./wc.js"></script>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; }
      clover-viewer { display: block; }
    </style>
  </head>
  <body>
    <!--
      A local manifest, so the test does not depend on iiif.io resolving in CI.

      `canvasHeight` is pinned short on purpose: the six controls fit inside the 500px
      default at any viewport, so only a canvas this short reproduces the overflow.
    -->
    <clover-viewer options='{"canvasHeight":"260px"}'></clover-viewer>
    <script>
      // Absolute, and set from the page's own origin: Clover tries to base64-decode the
      // attribute as a content state first, which a relative path fails. Hardcoding the
      // host here would tie the fixture to one port.
      document
        .querySelector("clover-viewer")
        .setAttribute(
          "iiif-content",
          new URL("./reflow-manifest.json", location.href).href,
        );
    </script>
  </body>
</html>
