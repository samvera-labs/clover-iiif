<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clover WC Custom Player</title>
    <script src="./wc.js"></script>
    <style>
      body {
        font-family: system-ui, sans-serif;
        padding: 16px;
      }
      clover-viewer {
        display: block;
        height: 70vh;
        margin-top: 16px;
      }
    </style>
  </head>
  <body>
    <h1>Clover WC Custom Player</h1>
    <!--
      The custom player running through the web component, which is built with React aliased
      to `preact/compat` — the one framework Vidstack does not list as supported. This page
      is what proves the two behave the same.

      Everything is local and WebM on purpose. Playwright's bundled Chromium ships without
      proprietary codecs, so an H.264 fixture never reaches `canplay` there and the player
      correctly keeps its controls hidden — which reads exactly like a framework bug and is
      not one. VP9 decodes everywhere, and same-origin files keep the test off the network.
    -->
    <clover-viewer
      iiif-content="http://127.0.0.1:3002/wc-video-manifest.json"
      options='{"player":{"controls":"custom"},"informationPanel":{"open":false}}'
    ></clover-viewer>
  </body>
</html>
